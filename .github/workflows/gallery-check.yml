# Gallery check: every PR on this repository must pass `export-gallery --check`
# before it is merged (objectstack-ai/objectstack#31122). The check lives with
# the exporter in objectstack-ai/objectstack (packages/qa/scenarios,
# src/export/check.ts), so what the exporter writes and what this workflow
# accepts cannot drift. It fails the PR, one line per finding, when:
#   - index.json does not match the exporter's schema;
#   - an index entry has no complete apps/ID/ directory (source, run record,
#     scorecard, transcript, at least one screenshot), or a directory under
#     apps/ is not listed;
#   - a .env* name, a node_modules directory, a symbolic link or a local
#     absolute path appears anywhere in the tree;
#   - an app's framework.version is not a stable @objectstack/cli release
#     published on npm (read with `npm view @objectstack/cli versions`).
#
# It only reads: the token is contents: read, nothing is pushed or commented,
# and no file from the PR is executed. npx runs outside the checkout (in the
# runner's temp directory), so a .npmrc or package.json in the PR cannot
# change where the checker is fetched from or what runs; the tree is only read.
#
# The checker is the published @objectstack/scenarios package, run with npx at
# one exact version (the last step). Never `latest` and never a
# range: a release that changes the checker must not change what this required
# check accepts without a PR here.
#
# Version-pin rule: the pin moves when an objectstack release changes the
# checker (src/export/check.ts, check-cli.ts) or the index schema
# (src/export/manifest.ts). The PR that moves it is that release's
# gallery-refresh PR (its export/VERSION branch), which then runs the checker
# of the release it was exported with. A release that changes the checker but
# exports nothing moves the pin in a separate PR here. Either PR's own
# Gallery check run is the proof the new pin reads the tree as clean.

name: Gallery check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gallery-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Gallery check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this PR
        uses: actions/checkout@v7
        with:
          path: gallery
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # @objectstack/scenarios declares engines.node >=22.0.0.
          node-version: '22'

      - name: export-gallery --check
        # The pinned checker: one exact version (see the version-pin rule above).
        working-directory: ${{ runner.temp }}
        run: npx --yes @objectstack/scenarios@18.4.0 export-gallery --check "$GITHUB_WORKSPACE/gallery"
